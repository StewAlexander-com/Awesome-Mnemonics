pipelines:
  - id: crisis-response
    name: Crisis Response Chain
    steps: [STOP, TRACE, DEBUG, "8D"]
    when: "Production outages, system failures, critical incidents"
    time: "1-4 hours"
    tags: [crisis, production, outage, troubleshooting]
  - id: conflict-resolution
    name: Conflict Resolution Chain
    steps: [WAIT, BREATHE, PAUSE, RACI]
    when: "Team disagreements, tense meetings, stakeholder conflicts"
    time: "5-20 minutes"
    tags: [conflict, communication]
  - id: root-cause
    name: Root Cause Investigation Chain
    steps: [ICEBERG, "5 Whys", PADDER, RACI]
    when: "Recurring issues, complex system problems, post-incident analysis"
    time: "1-2 hours"
    tags: [rca, recurring]
  - id: strategic-design
    name: Strategic Design Chain
    steps: [SCALE, SWOT, PESTEL, SET]
    when: "Infrastructure planning, architecture reviews, capacity planning"
    time: "2-4 hours"
    tags: [strategic, design, planning]
  - id: stress-burnout
    name: Stress Burnout Recovery Chain
    steps: [PACE, ARIES, CALM, SHINE]
    when: "Long-term stress, approaching burnout, lifestyle reset"
    time: "Ongoing (2-4 weeks)"
    tags: [stress, burnout]
  - id: rapid-triage
    name: Rapid Triage Chain
    steps: [IDEA, DICE, FATE]
    when: "Quick wins, time-critical decisions, feasibility check"
    time: "Variable"
    tags: [triage, quick, feasibility]
